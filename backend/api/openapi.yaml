    delete:
      tags: [Verification Queue]
      summary: Delete task
      description: Remove a task from the queue.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "task_001"
      responses:
        '204':
          description: Task deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /queue/tasks/{id}/restart:
    post:
      tags: [Verification Queue]
      summary: Restart a failed task
      description: Restart a previously failed task from the beginning.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "task_001"
      responses:
        '200':
          description: Task restarted successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/QueueTask'
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                success: true
                data:
                  id: "task_001"
                  name: "Verify Payment Gateway v2.0"
                  systemId: "sys_pg1"
                  systemName: "Payment Gateway"
                  status: "pending"
                  priority: "high"
                  assigneeId: "usr_abc123"
                  assigneeName: "Jane Doe"
                  progress: 0
                  checkTypes: ["static-analysis", "dependency-scan", "config-audit"]
                  createdAt: "2024-01-15T13:00:00Z"
                  updatedAt: "2024-01-15T14:35:00Z"
                  startedAt: null
                  scheduledAt: null
                  completedAt: null
                  estimatedDuration: 3600
                meta:
                  timestamp: "2024-01-15T14:35:00Z"
                  requestId: "req_tuv345"
        '400':
          description: Cannot restart a non-failed task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                success: false
                error:
                  code: "BAD_REQUEST"
                  message: "Only failed tasks can be restarted"
                  status: 400
                meta:
                  timestamp: "2024-01-15T14:35:00Z"
                  requestId: "req_tuv345"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /queue/tasks/{id}/cancel:
    post:
      tags: [Verification Queue]
      summary: Cancel a pending task
      description: Cancel a task that is pending or scheduled (not yet running).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "task_002"
      responses:
        '200':
          description: Task cancelled successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/QueueTask'
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                success: true
                data:
                  id: "task_002"
                  name: "Audit Auth Service"
                  systemId: "sys_as2"
                  systemName: "Auth Service v2"
                  status: "cancelled"
                  priority: "normal"
                  assigneeId: null
                  assigneeName: null
                  progress: 0
                  checkTypes: ["static-analysis", "penetration-test"]
                  createdAt: "2024-01-15T12:00:00Z"
                  updatedAt: "2024-01-15T14:40:00Z"
                  startedAt: null
                  scheduledAt: "2024-01-15T15:00:00Z"
                  completedAt: null
                  estimatedDuration: 7200
                meta:
                  timestamp: "2024-01-15T14:40:00Z"
                  requestId: "req_vwx456"
        '400':
          description: Cannot cancel a running task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                success: false
                error:
                  code: "BAD_REQUEST"
                  message: "Cannot cancel a running task"
                  status: 400
                meta:
                  timestamp: "2024-01-15T14:40:00Z"
                  requestId: "req_vwx456"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /queue/tasks/{id}/logs:
    get:
      tags: [Verification Queue]
      summary: Get task logs
      description: |
        Retrieve logs for a specific task. Supports streaming via
        `Accept: text/event-stream` header for real-time log updates.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "task_001"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: level
          in: query
          schema:
            type: string
            enum: [debug, info, warn, error]
          description: Filter by log level
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: Only return logs after this timestamp
      responses:
        '200':
          description: Task logs retrieved (or stream started)
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskLog'
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - $ref: '#/components/schemas/PaginationMeta'
              example:
                success: true
                data:
                  - id: "log_001"
                    taskId: "task_001"
                    level: "info"
                    message: "Task initialization complete"
                    timestamp: "2024-01-15T13:05:01Z"
                    metadata:
                      step: "init"
                      duration: 0.8
                  - id: "log_002"
                    taskId: "task_001"
                    level: "info"
                    message: "Starting static analysis phase"
                    timestamp: "2024-01-15T13:05:15Z"
                    metadata:
                      step: "static-analysis"
                      filesScanned: 1240
                  - id: "log_003"
                    taskId: "task_001"
                    level: "warn"
                    message: "Deprecated API usage detected in module auth.js:42"
                    timestamp: "2024-01-15T13:08:22Z"
                    metadata:
                      step: "static-analysis"
                      file: "auth.js"
                      line: 42
                meta:
                  timestamp: "2024-01-15T14:20:00Z"
                  requestId: "req_yza567"
                  pagination:
                    page: 1
                    limit: 100
                    total: 45
                    totalPages: 1
                    hasNext: false
                    hasPrev: false
            text/event-stream:
              schema:
                type: string
                description: Server-sent events stream of log entries
                example: |
                  event: log
                  data: {"id":"log_004","taskId":"task_001","level":"info","message":"Dependency scan started","timestamp":"2024-01-15T13:10:00Z"}

                  event: log
                  data: {"id":"log_005","taskId":"task_001","level":"info","message":"Scanned 50 of 200 dependencies","timestamp":"2024-01-15T13:10:30Z"}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /queue/batch:
    post:
      tags: [Verification Queue]
      summary: Batch operations
      description: Perform bulk operations (restart, cancel, delete) on selected tasks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchOperationRequest'
            example:
              operation: "restart"
              taskIds: ["task_004", "task_005", "task_006"]
      responses:
        '200':
          description: Batch operation completed
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [operation, processed, succeeded, failed, errors]
                    properties:
                      operation:
                        type: string
                        enum: [restart, cancel, delete]
                      processed:
                        type: integer
                        description: Total number of tasks processed
                      succeeded:
                        type: integer
                        description: Number of tasks successfully processed
                      failed:
                        type: integer
                        description: Number of tasks that failed
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            taskId:
                              type: string
                            error:
                              type: string
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                success: true
                data:
                  operation: "restart"
                  processed: 3
                  succeeded: 3
                  failed: 0
                  errors: []
                meta:
                  timestamp: "2024-01-15T14:45:00Z"
                  requestId: "req_bcd678"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /queue/counts:
    get:
      tags: [Verification Queue]
      summary: Get task counts by status
      description: Retrieve counts of tasks grouped by status for tab badges.
      responses:
        '200':
          description: Task counts retrieved
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [total, byStatus]
                    properties:
                      total:
                        type: integer
                      byStatus:
                        type: array
                        items:
                          type: object
                          required: [status, count, label]
                          properties:
                            status:
                              type: string
                            count:
                              type: integer
                            label:
                              type: string
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                success: true
                data:
                  total: 18
                  byStatus:
                    - status: "pending"
                      count: 8
                      label: "Pending"
                    - status: "running"
                      count: 5
                      label: "Running"
                    - status: "completed"
                      count: 3
                      label: "Completed"
                    - status: "failed"
                      count: 2
                      label: "Failed"
                    - status: "cancelled"
                      count: 0
                      label: "Cancelled"
                meta:
                  timestamp: "2024-01-15T14:20:00Z"
                  requestId: "req_cde789"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'


# ============================================================
# Components
# ============================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token obtained from /auth/login or /auth/refresh

  schemas:
    # ----------------------------------------------------------
    # Shared / Meta
    # ----------------------------------------------------------
    Meta:
      type: object
      required: [timestamp, requestId]
      properties:
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string

    PaginationMeta:
      type: object
      required: [pagination]
      properties:
        pagination:
          type: object
          required: [page, limit, total, totalPages, hasNext, hasPrev]
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer
            hasNext:
              type: boolean
            hasPrev:
              type: boolean

    ApiError:
      type: object
      required: [success, error, meta]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message, status]
          properties:
            code:
              type: string
              description: Machine-readable error code
              example: "VALIDATION_ERROR"
            message:
              type: string
              description: Human-readable error message
              example: "Invalid request parameters"
            details:
              type: string
              description: Additional error details
              example: "Field 'email' must be a valid email address"
            status:
              type: integer
              description: HTTP status code
              example: 400
        meta:
          $ref: '#/components/schemas/Meta'

    # ----------------------------------------------------------
    # Auth & Users
    # ----------------------------------------------------------
    User:
      type: object
      required: [id, email, firstName, lastName, role, isActive, createdAt, updatedAt]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [admin, analyst, viewer]
        avatar:
          type: string
          format: uri
          nullable: true
        isActive:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    JWTPayload:
      type: object
      required: [sub, email, role, iat, exp]
      properties:
        sub:
          type: string
          description: User ID
        email:
          type: string
        role:
          type: string
          enum: [admin, analyst, viewer]
        iat:
          type: integer
          description: Issued at timestamp
        exp:
          type: integer
          description: Expiration timestamp

    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: Must contain uppercase, lowercase, digit, and special character
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        role:
          type: string
          enum: [admin, analyst, viewer]
          default: "analyst"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      required: [success, data, meta]
      properties:
        success:
          type: boolean
        data:
          type: object
          required: [user, token]
          properties:
            user:
              $ref: '#/components/schemas/User'
            token:
              type: object
              required: [accessToken, refreshToken, expiresIn]
              properties:
                accessToken:
                  type: string
                refreshToken:
                  type: string
                expiresIn:
                  type: integer
                  description: Token expiry in seconds
        meta:
          $ref: '#/components/schemas/Meta'

    # ----------------------------------------------------------
    # Dashboard & Metrics
    # ----------------------------------------------------------
    DashboardMetrics:
      type: object
      required: [totalSystems, verifiedSystems, pendingVerifications, failedVerifications, totalEvidence, queueTasks, queueCompletedToday, queueFailedToday]
      properties:
        totalSystems:
          type: integer
          description: Total number of registered systems
        verifiedSystems:
          type: integer
          description: Number of systems with passed verification
        pendingVerifications:
          type: integer
          description: Number of systems awaiting verification
        failedVerifications:
          type: integer
          description: Number of systems with failed verification
        totalEvidence:
          type: integer
          description: Total number of evidence files uploaded
        queueTasks:
          type: integer
          description: Total number of tasks currently in queue
        queueCompletedToday:
          type: integer
          description: Tasks completed today
        queueFailedToday:
          type: integer
          description: Tasks that failed today

    TrendDataPoint:
      type: object
      required: [date, total, passed, failed, pending]
      properties:
        date:
          type: string
          format: date
        total:
          type: integer
        passed:
          type: integer
        failed:
          type: integer
        pending:
          type: integer

    StatusDistribution:
      type: object
      required: [status, label, count, percentage]
      properties:
        status:
          type: string
        label:
          type: string
        count:
          type: integer
        percentage:
          type: number
          format: float

    ActivityItem:
      type: object
      required: [id, type, title, description, createdAt]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [verification, upload, system, queue, user]
        title:
          type: string
        description:
          type: string
        userId:
          type: string
          nullable: true
        userName:
          type: string
          nullable: true
        systemId:
          type: string
          nullable: true
        systemName:
          type: string
          nullable: true
        taskId:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        createdAt:
          type: string
          format: date-time

    # ----------------------------------------------------------
    # Evidence Upload
    # ----------------------------------------------------------
    UploadStatus:
      type: string
      enum: [pending, processing, completed, failed]

    EvidenceUpload:
      type: object
      required: [id, fileName, originalName, mimeType, size, status, uploadedBy, createdAt, updatedAt]
      properties:
        id:
          type: string
        fileName:
          type: string
        originalName:
          type: string
        mimeType:
          type: string
        size:
          type: integer
          description: File size in bytes
        status:
          $ref: '#/components/schemas/UploadStatus'
        systemId:
          type: string
          nullable: true
        systemName:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
          nullable: true
        uploadedBy:
          type: string
        uploaderName:
          type: string
        downloadUrl:
          type: string
          format: uri
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ----------------------------------------------------------
    # Portfolio (Systems)
    # ----------------------------------------------------------
    SystemType:
      type: string
      enum: [web_app, mobile_app, api, database, network, desktop, cloud_service, embedded, other]

    SystemStatus:
      type: string
      enum: [verified, pending, failed, not_started, in_progress]

    System:
      type: object
      required: [id, name, description, type, status, ownerId, ownerName, version, lastVerifiedAt, evidenceCount, tags, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          $ref: '#/components/schemas/SystemType'
        status:
          $ref: '#/components/schemas/SystemStatus'
        ownerId:
          type: string
        ownerName:
          type: string
        version:
          type: string
        lastVerifiedAt:
          type: string
          format: date-time
          nullable: true
        evidenceCount:
          type: integer
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateSystemRequest:
      type: object
      required: [name, description, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 2000
        type:
          $ref: '#/components/schemas/SystemType'
        ownerId:
          type: string
          description: Defaults to current user if not provided
        version:
          type: string
          maxLength: 50
          default: "1.0.0"
        tags:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 20
        metadata:
          type: object
          additionalProperties: true

    UpdateSystemRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 2000
        type:
          $ref: '#/components/schemas/SystemType'
        ownerId:
          type: string
        version:
          type: string
          maxLength: 50
        tags:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 20
        status:
          $ref: '#/components/schemas/SystemStatus'
        metadata:
          type: object
          additionalProperties: true

    VerificationHistory:
      type: object
      required: [id, systemId, systemName, status, verifierId, verifierName, startedAt, completedAt, findingsCount, summary]
      properties:
        id:
          type: string
        systemId:
          type: string
        systemName:
          type: string
        status:
          type: string
          enum: [passed, failed, cancelled, in_progress]
        verifierId:
          type: string
        verifierName:
          type: string
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        duration:
          type: integer
          nullable: true
          description: Duration in seconds
        findingsCount:
          type: integer
        summary:
          type: string
        checkTypes:
          type: array
          items:
            type: string

    EvidenceFile:
      type: object
      required: [id, fileName, mimeType, size, uploadedBy, uploadedAt]
      properties:
        id:
          type: string
        fileName:
          type: string
        mimeType:
          type: string
        size:
          type: integer
        description:
          type: string
          nullable: true
        uploadedBy:
          type: string
        uploadedAt:
          type: string
          format: date-time
        downloadUrl:
          type: string
          format: uri
          nullable: true

    # ----------------------------------------------------------
    # Verification Queue
    # ----------------------------------------------------------
    TaskStatus:
      type: string
      enum: [pending, running, completed, failed, cancelled]

    TaskPriority:
      type: string
      enum: [low, normal, high, critical]

    QueueTask:
      type: object
      required: [id, name, systemId, systemName, status, priority, progress, checkTypes, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        systemId:
          type: string
        systemName:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatus'
        priority:
          $ref: '#/components/schemas/TaskPriority'
        assigneeId:
          type: string
          nullable: true
        assigneeName:
          type: string
          nullable: true
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Completion percentage
        checkTypes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        estimatedDuration:
          type: integer
          nullable: true
          description: Estimated duration in seconds

    CreateTaskRequest:
      type: object
      required: [name, systemId, checkTypes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        systemId:
          type: string
        priority:
          $ref: '#/components/schemas/TaskPriority'
          default: "normal"
        checkTypes:
          type: array
          items:
            type: string
          minItems: 1
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        assigneeId:
          type: string
          nullable: true

    UpdateTaskRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        priority:
          $ref: '#/components/schemas/TaskPriority'
        status:
          $ref: '#/components/schemas/TaskStatus'
        assigneeId:
          type: string
          nullable: true
        scheduledAt:
          type: string
          format: date-time
          nullable: true
        checkTypes:
          type: array
          items:
            type: string

    TaskLog:
      type: object
      required: [id, taskId, level, message, timestamp]
      properties:
        id:
          type: string
        taskId:
          type: string
        level:
          type: string
          enum: [debug, info, warn, error]
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
          nullable: true

    BatchOperationRequest:
      type: object
      required: [operation, taskIds]
      properties:
        operation:
          type: string
