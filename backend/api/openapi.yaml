openapi: 3.0.3
info:
  title: No-Backdoor System Architecture API
  description: |
    Security verification platform backend API. Provides endpoints for dashboard metrics,
    evidence upload, system portfolio management, and verification queue operations.
  version: 1.0.0
  contact:
    name: API Support
    email: api@nobackdoor.local
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000/api
    description: Local development server
  - url: https://api.nobackdoor.local/v1
    description: Production server

security:
  - BearerAuth: []

paths:
  # ============================================================
  # Auth & Users
  # ============================================================
  /auth/register:
    post:
      tags: [Auth & Users]
      summary: Register a new user
      description: Create a new user account with email, password, and profile details.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: "user@example.com"
              password: "SecurePass123!"
              firstName: "Jane"
              lastName: "Doe"
              role: "analyst"
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                success: true
                data:
                  user:
                    id: "usr_abc123"
                    email: "user@example.com"
                    firstName: "Jane"
                    lastName: "Doe"
                    role: "analyst"
                    isActive: true
                    createdAt: "2024-01-15T09:30:00Z"
                    updatedAt: "2024-01-15T09:30:00Z"
                  token:
                    accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    refreshToken: "dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4..."
                    expiresIn: 3600
                meta:
                  timestamp: "2024-01-15T09:30:00Z"
                  requestId: "req_xyz789"
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                success: false
                error:
                  code: "CONFLICT"
                  message: "Email already registered"
                  details: "A user with this email address already exists."
                  status: 409
                meta:
                  timestamp: "2024-01-15T09:30:00Z"
                  requestId: "req_xyz789"
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/login:
    post:
      tags: [Auth & Users]
      summary: User login
      description: Authenticate with email and password to receive JWT tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: "user@example.com"
              password: "SecurePass123!"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                success: true
                data:
                  user:
                    id: "usr_abc123"
                    email: "user@example.com"
                    firstName: "Jane"
                    lastName: "Doe"
                    role: "analyst"
                    isActive: true
                    createdAt: "2024-01-10T08:00:00Z"
                    updatedAt: "2024-01-15T14:20:00Z"
                  token:
                    accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    refreshToken: "dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4..."
                    expiresIn: 3600
                meta:
                  timestamp: "2024-01-15T14:20:00Z"
                  requestId: "req_abc456"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                success: false
                error:
                  code: "UNAUTHORIZED"
                  message: "Invalid email or password"
                  status: 401
                meta:
                  timestamp: "2024-01-15T14:20:00Z"
                  requestId: "req_abc456"
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/refresh:
    post:
      tags: [Auth & Users]
      summary: Refresh access token
      description: Use a refresh token to obtain a new access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  description: The refresh token obtained during login
                  example: "dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4..."
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required: [accessToken, expiresIn]
                    properties:
                      accessToken:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      refreshToken:
                        type: string
                        example: "dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4..."
                      expiresIn:
                        type: integer
                        description: Token expiry in seconds
                        example: 3600
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                success: false
                error:
                  code: "UNAUTHORIZED"
                  message: "Refresh token expired"
                  status: 401
                meta:
                  timestamp: "2024-01-15T14:20:00Z"
                  requestId: "req_def789"
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/me:
    get:
      tags: [Auth & Users]
      summary: Get current user profile
      description: Retrieve the authenticated user's profile information.
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                success: true
                data:
                  id: "usr_abc123"
                  email: "user@example.com"
                  firstName: "Jane"
                  lastName: "Doe"
                  role: "analyst"
                  avatar: "https://cdn.example.com/avatars/usr_abc123.png"
                  isActive: true
                  lastLoginAt: "2024-01-15T14:20:00Z"
                  createdAt: "2024-01-10T08:00:00Z"
                  updatedAt: "2024-01-15T14:20:00Z"
                meta:
                  timestamp: "2024-01-15T14:20:00Z"
                  requestId: "req_ghi012"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Auth & Users]
      summary: Update user profile
      description: Update the authenticated user's profile information.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: "Jane"
                lastName:
                  type: string
                  minLength: 1
                  maxLength: 100
                  example: "Smith"
                avatar:
                  type: string
                  format: uri
                  nullable: true
                  example: "https://cdn.example.com/avatars/new.png"
            minProperties: 1
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                success: true
                data:
                  id: "usr_abc123"
                  email: "user@example.com"
                  firstName: "Jane"
                  lastName: "Smith"
                  role: "analyst"
                  avatar: "https://cdn.example.com/avatars/new.png"
                  isActive: true
                  lastLoginAt: "2024-01-15T14:20:00Z"
                  createdAt: "2024-01-10T08:00:00Z"
                  updatedAt: "2024-01-15T16:45:00Z"
                meta:
                  timestamp: "2024-01-15T16:45:00Z"
                  requestId: "req_jkl345"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================
  # Dashboard / Metrics
  # ============================================================
  /metrics/summary:
    get:
      tags: [Dashboard & Metrics]
      summary: Get dashboard summary metrics
      description: Retrieve aggregated counts for dashboard summary cards.
      responses:
        '200':
          description: Summary metrics retrieved
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DashboardMetrics'
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                success: true
                data:
                  totalSystems: 142
                  verifiedSystems: 89
                  pendingVerifications: 23
                  failedVerifications: 12
                  totalEvidence: 847
                  queueTasks: 18
                  queueCompletedToday: 7
                  queueFailedToday: 2
                meta:
                  timestamp: "2024-01-15T14:20:00Z"
                  requestId: "req_mno678"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /metrics/trends:
    get:
      tags: [Dashboard & Metrics]
      summary: Get 30-day verification trends
      description: Retrieve daily verification counts for the last 30 days for area chart visualization.
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            minimum: 7
            maximum: 90
            default: 30
          description: Number of days to include in the trend
      responses:
        '200':
          description: Trend data retrieved
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [trends, periodStart, periodEnd]
                    properties:
                      trends:
                        type: array
                        items:
                          $ref: '#/components/schemas/TrendDataPoint'
                      periodStart:
                        type: string
                        format: date
                      periodEnd:
                        type: string
                        format: date
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                success: true
                data:
                  trends:
                    - date: "2024-12-17"
                      total: 12
                      passed: 8
                      failed: 2
                      pending: 2
                    - date: "2024-12-18"
                      total: 15
                      passed: 10
                      failed: 3
                      pending: 2
                  periodStart: "2024-12-17"
                  periodEnd: "2025-01-15"
                meta:
                  timestamp: "2024-01-15T14:20:00Z"
                  requestId: "req_pqr901"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /metrics/status:
    get:
      tags: [Dashboard & Metrics]
      summary: Get system status distribution
      description: Retrieve the distribution of systems by verification status for donut chart.
      responses:
        '200':
          description: Status distribution retrieved
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [distribution, total]
                    properties:
                      distribution:
                        type: array
                        items:
                          $ref: '#/components/schemas/StatusDistribution'
                      total:
                        type: integer
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                success: true
                data:
                  distribution:
                    - status: "verified"
                      label: "Verified"
                      count: 89
                      percentage: 62.7
                    - status: "pending"
                      label: "Pending"
                      count: 23
                      percentage: 16.2
                    - status: "failed"
                      label: "Failed"
                      count: 12
                      percentage: 8.5
                    - status: "not_started"
                      label: "Not Started"
                      count: 18
                      percentage: 12.7
                  total: 142
                meta:
                  timestamp: "2024-01-15T14:20:00Z"
                  requestId: "req_stu234"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /activity/recent:
    get:
      tags: [Dashboard & Metrics]
      summary: Get recent activity feed
      description: Retrieve a paginated list of recent platform activities.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: type
          in: query
          schema:
            type: string
            enum: [verification, upload, system, queue, user]
          description: Filter by activity type
      responses:
        '200':
          description: Recent activity retrieved
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActivityItem'
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - $ref: '#/components/schemas/PaginationMeta'
              example:
                success: true
                data:
                  - id: "act_001"
                    type: "verification"
                    title: "System 'Firewall-v3' verified"
                    description: "Verification completed with 0 issues found"
                    userId: "usr_abc123"
                    userName: "Jane Doe"
                    systemId: "sys_fw3"
                    systemName: "Firewall-v3"
                    createdAt: "2024-01-15T14:18:00Z"
                  - id: "act_002"
                    type: "upload"
                    title: "Evidence uploaded"
                    description: "3 files uploaded for 'Payment Gateway'"
                    userId: "usr_def456"
                    userName: "John Smith"
                    systemId: "sys_pg1"
                    systemName: "Payment Gateway"
                    createdAt: "2024-01-15T13:45:00Z"
                meta:
                  timestamp: "2024-01-15T14:20:00Z"
                  requestId: "req_vwx567"
                  pagination:
                    page: 1
                    limit: 20
                    total: 156
                    totalPages: 8
                    hasNext: true
                    hasPrev: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'


  # ============================================================
  # Evidence Upload
  # ============================================================
  /evidence/upload:
    post:
      tags: [Evidence Upload]
      summary: Upload evidence files
      description: |
        Upload one or more evidence files via multipart form data.
        Supports images, documents, and archives up to 100MB each.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Evidence files to upload (max 10 per request, 100MB each)
                systemId:
                  type: string
                  description: Optional system to associate the evidence with
                  example: "sys_fw3"
                description:
                  type: string
                  maxLength: 1000
                  description: Description of the uploaded evidence
                  example: "Source code review documentation for v2.4.1"
                tags:
                  type: string
                  description: Comma-separated list of tags
                  example: "source-code,v2.4.1,review"
            encoding:
              files:
                style: form
                explode: true
      responses:
        '201':
          description: Files uploaded successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    required: [uploads]
                    properties:
                      uploads:
                        type: array
                        items:
                          $ref: '#/components/schemas/EvidenceUpload'
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                success: true
                data:
                  uploads:
                    - id: "evd_abc123"
                      fileName: "source-review.pdf"
                      originalName: "source-review.pdf"
                      mimeType: "application/pdf"
                      size: 2457600
                      status: "completed"
                      systemId: "sys_fw3"
                      systemName: "Firewall-v3"
                      description: "Source code review documentation"
                      tags: ["source-code", "v2.4.1", "review"]
                      uploadedBy: "usr_abc123"
                      uploaderName: "Jane Doe"
                      createdAt: "2024-01-15T14:20:00Z"
                      updatedAt: "2024-01-15T14:20:00Z"
                meta:
                  timestamp: "2024-01-15T14:20:00Z"
                  requestId: "req_yza890"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                success: false
                error:
                  code: "PAYLOAD_TOO_LARGE"
                  message: "File exceeds maximum size limit"
                  details: "Maximum file size is 100MB"
                  status: 413
                meta:
                  timestamp: "2024-01-15T14:20:00Z"
                  requestId: "req_yza890"
        '500':
          $ref: '#/components/responses/InternalError'

  /evidence:
    get:
      tags: [Evidence Upload]
      summary: List recent uploads
      description: Retrieve a paginated, filterable list of evidence uploads.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, completed, failed]
          description: Filter by upload status
        - name: systemId
          in: query
          schema:
            type: string
          description: Filter by associated system
        - name: search
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 200
          description: Search by file name or description
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [createdAt, fileName, size, status]
            default: createdAt
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
      responses:
        '200':
          description: Evidence list retrieved
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EvidenceUpload'
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/Meta'
                      - $ref: '#/components/schemas/PaginationMeta'
              example:
                success: true
                data:
                  - id: "evd_abc123"
                    fileName: "source-review.pdf"
                    originalName: "source-review.pdf"
                    mimeType: "application/pdf"
                    size: 2457600
                    status: "completed"
                    systemId: "sys_fw3"
                    systemName: "Firewall-v3"
                    description: "Source code review documentation"
                    tags: ["source-code", "v2.4.1"]
                    uploadedBy: "usr_abc123"
                    uploaderName: "Jane Doe"
                    createdAt: "2024-01-15T14:20:00Z"
                    updatedAt: "2024-01-15T14:20:00Z"
                  - id: "evd_def456"
                    fileName: "network-scan.zip"
                    originalName: "network-scan-results.zip"
                    mimeType: "application/zip"
                    size: 5242880
                    status: "completed"
                    systemId: "sys_pg1"
                    systemName: "Payment Gateway"
                    description: "Network vulnerability scan results"
                    tags: ["scan", "network"]
                    uploadedBy: "usr_def456"
                    uploaderName: "John Smith"
                    createdAt: "2024-01-14T11:00:00Z"
                    updatedAt: "2024-01-14T11:00:00Z"
                meta:
                  timestamp: "2024-01-15T14:20:00Z"
                  requestId: "req_bcd123"
                  pagination:
                    page: 1
                    limit: 20
                    total: 847
                    totalPages: 43
                    hasNext: true
                    hasPrev: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /evidence/{id}:
    get:
      tags: [Evidence Upload]
      summary: Get upload detail
      description: Retrieve details of a single evidence upload.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "evd_abc123"
      responses:
        '200':
          description: Upload detail retrieved
          content:
            application/json:
              schema:
                type: object
                required: [success, data, meta]
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/EvidenceUpload'
                  meta:
                    $ref: '#/components/schemas/Meta'
              example:
                success: true
                data:
                  id: "evd_abc123"
                  fileName: "source-review.pdf"
                  originalName: "source-review.pdf"
                  mimeType: "application/pdf"
                  size: 2457600
                  status: "completed"
                  systemId: "sys_fw3"
                  systemName: "Firewall-v3"
                  description: "Source code review documentation for v2.4.1"
                  tags: ["source-code", "v2.4.1", "review"]
                  uploadedBy: "usr_abc123"
                  uploaderName: "Jane Doe"
                  downloadUrl: "https://cdn.example.com/evidence/evd_abc123.pdf"
                  createdAt: "2024-01-15T14:20:00Z"
                  updatedAt: "2024-01-15T14:20:00Z"
                meta:
                  timestamp: "2024-01-15T14:20:00Z"
                  requestId: "req_cde234"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Evidence Upload]
      summary: Delete an upload
      description: Remove an evidence upload and its associated file.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "evd_abc123"
      responses:
        '204':
          description: Upload deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ============================================================
  # Portfolio (Systems)
  # ============================================================
  /systems:
    get:
      tags: [Portfolio]
      summary: List all systems
      description: |
        Retrieve a paginated, searchable, and filterable list of systems.
        Supports filtering by status, type, and free-text search.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 200
          description: Search by name, description, or owner
        - name: status
          in: query
          schema:
            type: string
            enum: [verified, pending, failed, not_started, in_progress]
          description: Filter by verification status
        - name: type
          in: query
          schema:
            type: string
            enum: [web_app, mobile_app, api, database, network, desktop, cloud_service, embedded, other]
          description: Filter by system type
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [name, createdAt, updatedAt, status, lastVerifiedAt]
            default: createdAt
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
